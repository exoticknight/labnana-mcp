name: Publish to npm

# One-time npmjs.com setup: configure this public package's GitHub Actions
# Trusted Publisher for exoticknight/labnana-mcp, workflow publish.yml, with
# the npm publish action allowed. No long-lived NPM_TOKEN is used here.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; const expected = 'v' + pkg.version; if (process.env.RELEASE_TAG !== expected) { console.error('Release tag must be ' + expected + ', received ' + process.env.RELEASE_TAG); process.exit(1); }"

      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --access public

      - name: Wait for npm registry metadata
        env:
          MCP_NAME: io.github.exoticknight/labnana-mcp
          PACKAGE_NAME: '@exoticknight/labnana-mcp'
          PACKAGE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          version="${PACKAGE_VERSION#v}"
          for attempt in {1..12}; do
            published_name="$(npm view "${PACKAGE_NAME}@${version}" mcpName --json 2>/dev/null || true)"
            if [ "$published_name" = "\"$MCP_NAME\"" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "npm did not expose the expected mcpName in time."
          exit 1

      - name: Install MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: 1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            --output mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check -
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
