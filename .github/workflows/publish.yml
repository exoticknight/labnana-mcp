name: Publish to npm

# One-time npmjs.com setup: configure this public package's GitHub Actions
# Trusted Publisher for exoticknight/labnana-mcp, workflow publish.yml, with
# the npm publish action allowed. No long-lived NPM_TOKEN is used here.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; const expected = 'v' + pkg.version; if (process.env.RELEASE_TAG !== expected) { console.error('Release tag must be ' + expected + ', received ' + process.env.RELEASE_TAG); process.exit(1); }"

      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --access public
